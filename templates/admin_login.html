<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - ExamEase</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 420px;
            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            color: #172033;
            font-size: 30px;
        }

        .subtitle {
            color: #777;
            margin: 10px 0 30px;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;

            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #d5d8dd;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #172033;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;
            border-radius: 7px;

            background: #172033;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #26334d;
        }

        .back-home {
            display: inline-block;

            margin-top: 22px;

            color: #172033;

            text-decoration: none;

            font-size: 14px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="page">

    <div class="login-box">

        <div class="icon">
            🔐
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            ExamEase Administration Panel
        </p>

        <form method="POST"
              action="{{ url_for('admin_login') }}">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter admin email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
            >


            <button type="submit">
                Login as Admin
            </button>

        </form>


        <a href="{{ url_for('home') }}"
           class="back-home">

            ← Back to Home

        </a>

    </div>

</div>

</body>

</html>
