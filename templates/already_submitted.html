<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Exam Already Submitted - ExamEase</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .submitted-page {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .submitted-card {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 50px 40px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #e8f7ed;
            color: #217a3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        .submitted-card h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .submitted-card p {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .dashboard-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .dashboard-btn:hover {
            background: #444;
        }

        .results-btn {
            display: inline-block;
            padding: 13px 25px;
            margin-left: 8px;
            background: white;
            color: #222;
            border: 1px solid #222;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .results-btn:hover {
            background: #f5f5f5;
        }

        @media (max-width: 600px) {

            .submitted-card {
                padding: 40px 25px;
            }

            .submitted-card h1 {
                font-size: 25px;
            }

            .submitted-card p {
                font-size: 16px;
            }

            .results-btn {
                margin-left: 0;
                margin-top: 10px;
            }

        }

    </style>

</head>


<body>


    <nav>

        <div class="logo">
            ExamEase
        </div>

        <a href="/logout">
            Logout
        </a>

    </nav>


    <div class="submitted-page">

        <div class="submitted-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Exam Already Submitted
            </h1>

            <p>
                You have already submitted this exam.
                You cannot attempt the same exam again.
            </p>

            <a href="/student-dashboard"
               class="dashboard-btn">

                Back to Dashboard

            </a>

            <a href="/student-results"
               class="results-btn">

                View My Results

            </a>

        </div>

    </div>


</body>

</html>
