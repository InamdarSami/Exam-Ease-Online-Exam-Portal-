<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result - ExamEase</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <div class="logo">ExamEase</div>

    <a href="/student-dashboard">
        Dashboard
    </a>
</nav>

<div class="dashboard">

    <div class="dashboard-card">

        <h1>Exam Result 🎉</h1>

        <h2>{{ exam["exam_name"] }}</h2>

        <h3>Your Score</h3>

        <h1>
            {{ "%.2f"|format(score) }}
            /
            {{ "%.2f"|format(total_marks) }}
        </h1>

        <p>
            Percentage:
            {{ "%.2f"|format(percentage) }}%
        </p>

        <p>Correct Answers: {{ correct }}</p>
        <p>Wrong Answers: {{ wrong }}</p>
        <p>Unanswered: {{ unanswered }}</p>

        <br>

        <a href="/student-dashboard">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
