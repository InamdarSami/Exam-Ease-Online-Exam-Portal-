<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Submitted - ExamEase</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .submitted-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .submitted-card {
            background: white;
            width: 100%;
            max-width: 550px;
            text-align: center;
            padding: 50px 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        .submitted-card h1 {
            margin-bottom: 15px;
        }

        .submitted-card p {
            color: #666;
            line-height: 1.7;
        }

        .exam-name {
            font-weight: bold;
            color: #222;
        }

        .dashboard-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .dashboard-btn:hover {
            background: #444;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">ExamEase</div>

    <div>
        <a href="/student-dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="submitted-container">

    <div class="submitted-card">

        <div class="success-icon">✅</div>

        <h1>Exam Submitted Successfully!</h1>

        <p>
            Your answers for
            <span class="exam-name">
                {{ exam["exam_name"] }}
            </span>
            have been submitted successfully.
        </p>

        <p>
            Your result will be available in
            <strong>My Results</strong>
            after the teacher publishes it.
        </p>

        <a href="/student-dashboard" class="dashboard-btn">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
