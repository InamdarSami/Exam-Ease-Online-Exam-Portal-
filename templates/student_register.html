
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - ExamEase</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 16px;
            background: linear-gradient(135deg, #eaf2ff, #f5f7fb, #fff0df);
            font-family: Arial, sans-serif;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(31, 78, 121, 0.13);
            border: 1px solid #e5eaf1;
        }

        .register-brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            background: #1f4e79;
            color: white;
            border-radius: 14px;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .register-brand h1 {
            color: #1f4e79;
            font-size: 27px;
            margin: 0 0 8px;
        }

        .register-brand p {
            color: #6b7280;
            font-size: 14px;
            margin: 0;
        }

        .register-form label {
            display: block;
            color: #263548;
            font-size: 14px;
            font-weight: 600;
            margin: 16px 0 7px;
        }

        .register-form input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            background: #fbfcfe;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .register-form input:focus {
            border-color: #1f4e79;
            box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.1);
            background: #fff;
        }

        .register-form button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #1f4e79;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .register-form button:hover {
            background: #163a5b;
            transform: translateY(-1px);
        }

        .register-login {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin: 22px 0 14px;
        }

        .register-login a,
        .register-home {
            color: #1f4e79;
            font-weight: bold;
            text-decoration: none;
        }

        .register-login a:hover,
        .register-home:hover {
            color: #f28c28;
        }

        .register-home {
            display: block;
            text-align: center;
            font-size: 14px;
            margin-top: 16px;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 25px 20px;
            }

            .register-brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="register-page">
        <div class="register-card">

            <div class="register-brand">
                <div class="register-logo">E</div>
                <h1>Student Registration</h1>
                <p>Create your ExamEase student account</p>
            </div>

            <form class="register-form" method="POST"
                  action="{{ url_for('student_register') }}">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>

                <label for="roll_number">Roll Number</label>
                <input type="text" id="roll_number" name="roll_number"
                       placeholder="Enter your roll number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" required>

                <button type="submit">Create Student Account</button>
            </form>

            <p class="register-login">
                Already have an account?
                <a href="{{ url_for('student_login') }}">Login</a>
            </p>

            <a href="{{ url_for('home') }}" class="register-home">
                &#8592; Back to Home
            </a>

        </div>
    </div>
</body>
</html>
